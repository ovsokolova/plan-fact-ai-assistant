[project]
name = "plan-fact-ai-assistant"
version = "0.1.0"
description = "ИИ-ассистент по анализу отклонений план vs факт"
readme = "readme.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Olga Sokolova", email = "olgazim@yandex.ru" }
]
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "streamlit>=1.31",
    "plotly>=5.18",
    "openai>=1.14",
    "httpx>=0.27",
    "chromadb>=0.4",
    "sentence-transformers>=2.6",
    "pypdf>=4.1",
    "python-docx>=1.1",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "black>=24.3",
    "pre-commit>=3.7",
    "mypy>=1.10",
]
faiss = [
    "faiss-cpu>=1.8",
    "langchain>=0.2",
    "langchain-community>=0.2",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 70

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true